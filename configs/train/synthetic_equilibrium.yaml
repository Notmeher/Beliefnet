# Training schedule for the final paraphrase-robust pipeline (was EEN-v9).
# Mirrors the legacy script defaults so the new trainer reproduces v9 numbers.
seed: 0
out_dir: experiments/beliefnet_synthetic

equilibrium:
  epochs: 120
  lr: 5e-2

perception:
  epochs: 100
  lr: 1e-3
  batch_size: 64
  contrastive_w: 0.1
  aux_w: 0.3

span:
  epochs: 25
  lr: 1e-3
  batch_size: 64
